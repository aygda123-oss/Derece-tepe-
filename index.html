<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e"><title>Domino's Derece Takip</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202124;background:#f4f5f7}
*{box-sizing:border-box}body{margin:0}header{background:#c8102e;color:#fff;padding:22px 16px 18px}header h1{font-size:21px;margin:0 0 4px}header p{margin:0;font-size:13px;opacity:.9}
main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:15px;padding:16px;margin:0 0 14px;box-shadow:0 2px 10px #1111}
h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{min-width:0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.field input{width:100%;padding:13px 10px;border:1px solid #d6d9de;border-radius:10px;font-size:18px;background:#fff}
.full{margin-top:12px}.btn{border:0;border-radius:11px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#c8102e;color:white;width:100%;margin-top:15px}.secondary{background:#eef0f3;color:#24272b}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}
.note{font-size:12px;color:#686d75;margin:10px 0 0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}.filters label{font-size:12px;color:#555}.filters input,.filters select{width:100%;margin-top:4px;padding:10px;border:1px solid #d6d9de;border-radius:9px;background:white}
.record{border-top:1px solid #eceef1;padding:12px 0}.recordtop{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#5d626a}.values{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-top:8px;font-size:13px}.values b{color:#202124}.empty{color:#777;font-size:14px;text-align:center;padding:16px 0}
footer{text-align:center;color:#777;font-size:11px;padding:8px 16px 25px}
@media(max-width:380px){main{padding:11px}.card{padding:13px}.grid{gap:8px}.field label{font-size:12px}}
</style></head>
<body>
<header><h1>🍕 Domino's Derece Takip</h1><p>Tek şube · Kayıtlar bu cihazda saklanır</p></header>
<main>
<section class="card">
<h2>Yeni derece kaydı</h2>
<div class="grid">
<div class="field"><label for="ustSag">Mekline Üst Sağ (°C)</label><input id="ustSag" type="number" step="0.1" inputmode="decimal" placeholder="°C"></div>
<div class="field"><label for="ustSol">Mekline Üst Sol (°C)</label><input id="ustSol" type="number" step="0.1" inputmode="decimal" placeholder="°C"></div>
<div class="field"><label for="altSag">Mekline Alt Sağ (°C)</label><input id="altSag" type="number" step="0.1" inputmode="decimal" placeholder="°C"></div>
<div class="field"><label for="altSol">Mekline Alt Sol (°C)</label><input id="altSol" type="number" step="0.1" inputmode="decimal" placeholder="°C"></div>
</div>
<div class="field full"><label for="walkin">Walk-in (°C)</label><input id="walkin" type="number" step="0.1" inputmode="decimal" placeholder="°C"></div>
<div class="field full"><label for="sos">Pizza Sosu (°C)</label><input id="sos" type="number" step="0.1" inputmode="decimal" placeholder="°C"></div>
<button class="btn primary" id="save">Kaydı Kaydet</button>
<p class="note">Kaydettiğin anda cihazın tarih ve saati otomatik eklenir. En az bir derece girmen yeterli.</p>
</section>
<section class="card">
<h2>Geçmiş kayıtlar</h2>
<div class="filters">
<label>Tarih<input type="date" id="dateFilter"></label>
<label>Saat aralığı<select id="hourFilter"><option value="">Tüm saatler</option></select></label>
</div>
<div class="actions" style="margin-top:10px"><button class="btn secondary" id="clearFilters">Filtreleri temizle</button><button class="btn secondary" id="export">Yedeği indir</button><button class="btn secondary" id="importBtn">Yedek yükle</button><input id="importFile" type="file" accept="application/json" hidden></div>
<p class="note" id="count"></p><div id="records"></div>
</section>
</main><footer>Veriler yalnızca bu tarayıcıda saklanır. Düzenli yedek indirmen önerilir.</footer>
<script>
const KEY='dominos-degree-records-v1';
const fields=[['ustSag','Mekline Üst Sağ'],['ustSol','Mekline Üst Sol'],['altSag','Mekline Alt Sağ'],['altSol','Mekline Alt Sol'],['walkin','Walk-in'],['sos','Pizza Sosu']];
const $=id=>document.getElementById(id);
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function write(rows){localStorage.setItem(KEY,JSON.stringify(rows))}
function localParts(iso){const d=new Date(iso);return {date:[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),hour:String(d.getHours()).padStart(2,'0')+':00'}}
for(let h=0;h<24;h++){const v=String(h).padStart(2,'0')+':00';$('hourFilter').add(new Option(v,v))}
$('save').addEventListener('click',()=>{
 const vals={};let filled=0;
 for(const [id,name] of fields){const raw=$(id).value.trim();vals[id]=raw===''?null:Number(raw);if(raw!==''){if(!Number.isFinite(vals[id])){alert(name+' değeri geçerli değil.');return}filled++}}
 if(!filled){alert('Lütfen en az bir derece gir.');return}
 const rows=read();rows.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),createdAt:new Date().toISOString(),values:vals});
 try{write(rows)}catch(e){alert('Kayıt yapılamadı. Cihaz hafızasında yer olmayabilir.');return}
 for(const [id] of fields)$(id).value='';
 render();alert('Derece kaydı tarih ve saat bilgisiyle kaydedildi.');
});
function render(){
 const date=$('dateFilter').value,hour=$('hourFilter').value;
 const rows=read().filter(r=>{const p=localParts(r.createdAt);return (!date||p.date===date)&&(!hour||p.hour===hour)});
 $('count').textContent=rows.length+' kayıt gösteriliyor · Toplam '+read().length+' kayıt';
 const root=$('records');root.replaceChildren();
 if(!rows.length){root.innerHTML='<div class="empty">Bu filtrelerde kayıt bulunamadı.</div>';return}
 for(const r of rows){
  const wrap=document.createElement('div');wrap.className='record';
  const top=document.createElement('div');top.className='recordtop';
  const d=new Date(r.createdAt);top.textContent=d.toLocaleDateString('tr-TR')+' · '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const vals=document.createElement('div');vals.className='values';
  for(const [id,name] of fields){const item=document.createElement('div');const v=r.values[id];item.textContent=name+': ';const b=document.createElement('b');b.textContent=v===null||v===undefined?'—':v+' °C';item.append(b);vals.append(item)}
  wrap.append(top,vals);root.append(wrap);
 }
}
$('dateFilter').addEventListener('change',render);$('hourFilter').addEventListener('change',render);
$('clearFilters').addEventListener('click',()=>{$('dateFilter').value='';$('hourFilter').value='';render()});
$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'Dominos Derece Takip',version:1,records:read()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dominos-derece-yedek-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)});
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());const rows=Array.isArray(obj)?obj:obj.records;if(!Array.isArray(rows)||!rows.every(r=>r&&r.createdAt&&r.values))throw Error();const existing=read();const map=new Map(existing.map(r=>[r.id||r.createdAt,r]));for(const r of rows)map.set(r.id||r.createdAt,r);write([...map.values()].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));render();alert(rows.length+' kayıt yedeğe eklendi.')}catch{alert('Yedek dosyası okunamadı.')}e.target.value=''});
render();
</script></body></html>
